name: Tests

on:
    pull_request:
        paths:
            - "src/uconf/**/*.py"
            - "tests/**/*.py"
            - ".github/workflows/tests.yml"
            - "pyproject.toml"
            - "environment.yml"
    push:
        branches:
            - main
        paths:
            - "src/uconf/**/*.py"
            - "tests/**/*.py"
            - ".github/workflows/tests.yml"
            - "pyproject.toml"
            - "environment.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    pytest:
        name: Pytest (excluding configuration model)
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Conda and create Sage environment
              uses: conda-incubator/setup-miniconda@v4
              with:
                  activate-environment: sage
                  channel-priority: strict
                  environment-file: environment.yml
                  use-mamba: true
                  miniforge-version: latest

            - name: Install package and dev dependencies
              shell: bash -el {0}
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e . --group dev

            - name: Run test suite
              shell: bash -el {0}
              # test_configuration_model.py is excluded: it is far too expensive
              # to run on CI hardware. Run it locally when touching that model.
              run: |
                  pytest tests \
                    --ignore=tests/test_configuration_model.py \
                    -n auto --dist loadfile \
                    --durations=15 \
                    --color=yes
