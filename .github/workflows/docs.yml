name: Documentation

on:
    pull_request:
        paths:
            - "docs/**"
            - "src/uconf/**/*.py"
            - ".github/workflows/docs.yml"
            - "pyproject.toml"
            - "uv.lock"
            - "README.md"
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "src/uconf/**/*.py"
            - ".github/workflows/docs.yml"
            - "pyproject.toml"
            - "uv.lock"
            - "README.md"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build HTML docs
        runs-on: ubuntu-latest

        # SageMath comes from the official upstream image (the docs build
        # imports uconf and runs Sage doctests); uv installs everything else
        # from the lock file. The image is amd64-only.
        container:
            image: sagemath/sagemath:10.9

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "0.11.25"
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"

            - name: Install locked documentation dependencies into Sage's environment
              # See tests.yml for why `uv venv --system-site-packages` is not
              # usable inside this image.
              run: |
                  SAGEPY=$(sage -python -c 'import sys; print(sys.executable)')
                  uv export --frozen --no-hashes --no-emit-project --group docs -o /tmp/requirements-docs.txt
                  uv pip install --python "$SAGEPY" -r /tmp/requirements-docs.txt
                  uv pip install --python "$SAGEPY" --no-deps --no-build-isolation -e .

            - name: Run Sage doctests
              run: |
                  sage -python -m sage.doctest --force-lib --format github -p 0 src/uconf

            - name: Build HTML documentation
              run: |
                  sage -python -m sphinx -W --keep-going -b html docs docs/_build/html

            - name: Upload HTML documentation artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/_build/html

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
